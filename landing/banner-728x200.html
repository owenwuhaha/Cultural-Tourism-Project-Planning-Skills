<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0e17;
  width: 800px; height: 250px;
  display: flex; justify-content: center; align-items: center;
}
.banner {
  width: 728px; height: 200px;
  background: linear-gradient(135deg, #0a0e17 0%, #151a2e 50%, #201525 100%);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; padding: 0 32px;
  box-shadow: 0 8px 40px rgba(240,68,148,.25);
}
.banner::before {
  content:''; position:absolute;
  width:280px; height:280px;
  background: radial-gradient(circle, rgba(240,68,148,.12) 0%, transparent 70%);
  top:-80px; right:-60px;
}
.banner::after {
  content:''; position:absolute;
  width:200px; height:200px;
  background: radial-gradient(circle, rgba(0,240,255,.08) 0%, transparent 70%);
  bottom:-50px; left:-30px;
}
.left { flex:1; position:relative; z-index:2; }
.badge {
  display:inline-block;
  padding:3px 12px;
  border: 1px solid rgba(0,240,255,.25);
  border-radius: 10px;
  font-family: -apple-system,BlinkMacSystemFont,sans-serif;
  font-size: 10px;
  color: #00f0ff;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.title {
  font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size: 26px;
  font-weight: 900;
  color: #ffffff;
  line-height: 1.3;
  margin-bottom: 4px;
}
.title .emoji { margin-right: 6px; }
.title .highlight {
  background: linear-gradient(90deg, #f04494, #00f0ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  font-family: -apple-system,BlinkMacSystemFont,sans-serif;
  font-size: 13px;
  color: #94a3b8;
}
.right { text-align:center; position:relative; z-index:2; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  width: 140px; height: 42px;
  background: linear-gradient(135deg, #f04494, #c02468);
  border: none;
  border-radius: 21px;
  color: #fff;
  font-family: -apple-system,BlinkMacSystemFont,sans-serif;
  font-size: 14px; font-weight: 700;
  text-decoration: none;
  box-shadow: 0 4px 18px rgba(240,68,148,.35);
  cursor: pointer;
}
.right-tag {
  font-family: -apple-system,BlinkMacSystemFont,sans-serif;
  font-size: 10px;
  color: #64748b;
  margin-top: 6px;
}
</style>
</head>
<body>
<div class="banner">
  <div class="left">
    <div class="badge">⚡ OPEN SOURCE</div>
    <div class="title"><span class="emoji">🏔️</span><span class="highlight">文旅策划规划助手</span></div>
    <div class="subtitle">8个AI工具 · 33页知识库 · 最新 V2.6</div>
  </div>
  <div class="right">
    <a class="btn" href="https://github.com/owenwuhaha/Cultural-Tourism-Project-Planning-Skills" target="_blank">🚀 立即使用</a>
    <div class="right-tag">GitHub 开源 · 零依赖 · 一键运行</div>
  </div>
</div>
</body>
</html>
